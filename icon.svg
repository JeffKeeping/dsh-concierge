<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Super-agent Concierge">
  <title>Super-agent Concierge</title>
  <defs>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#7a4dff"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0f1424"/>
  <!-- Router: one hub that answers -->
  <circle cx="32" cy="16" r="8" fill="url(#hub)"/>
  <circle cx="32" cy="16" r="3" fill="#0f1424"/>
  <!-- Workers: three parallel lanes -->
  <g stroke="#3b4a6b" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M32 24v6"/>
    <path d="M32 30H15v8"/>
    <path d="M32 30v8"/>
    <path d="M32 30h17v8"/>
  </g>
  <rect x="8" y="38" width="14" height="14" rx="4" fill="#1d2739" stroke="#4f8cff" stroke-width="2"/>
  <rect x="25" y="38" width="14" height="14" rx="4" fill="#1d2739" stroke="#4f8cff" stroke-width="2"/>
  <rect x="42" y="38" width="14" height="14" rx="4" fill="#1d2739" stroke="#7a4dff" stroke-width="2"/>
  <circle cx="15" cy="45" r="1.6" fill="#7fbdff"/>
  <circle cx="32" cy="45" r="1.6" fill="#7fbdff"/>
  <circle cx="49" cy="45" r="1.6" fill="#b79cff"/>
</svg>
